<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Section: Metadata and styles -->
    <meta charset="UTF-8" />
    <title>Clicks Per Minute Counter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <!-- Section: App container -->
    <div class="app">
        <!-- Section: Header -->
        <h1>Clicks Per Minute</h1>
        <div class="subtitle">Click/Tap the button as fast as you can.</div>

        <!-- Section: Stats display -->
        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">Clicks/Taps</div>
                <div class="stat-value" id="clickCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Time</div>
                <div class="stat-value" id="timeElapsed">0.0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Clicks / min</div>
                <div class="stat-value" id="cpm">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label" id="highRecordLabel">High record (CPM)</div>
                <div class="stat-value" id="highRecord">0</div>
            </div>
        </div>

        <div class="record-progress">
            <div class="record-progress-label" id="recordProgressLabel">High score progress</div>
            <div class="record-progress-track" id="recordProgress" role="progressbar"
                aria-labelledby="recordProgressLabel" aria-describedby="recordProgressText"
                aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <div class="record-progress-fill" id="recordProgressFill"></div>
            </div>
            <div class="record-progress-text" id="recordProgressText">Set a high score first to enjoy this feature.</div>
        </div>

        <!-- Section: Tap area -->
        <button id="tapArea">CLICK/TAP HERE</button>

        <!-- Section: Controls -->
        <div class="controls">
            <button class="btn" id="resetBtn">Reset</button>
            <button class="btn" id="resetRecordBtn">Reset record</button>
            <label class="toggle-control" for="deductToggle">
                <span class="toggle-label">Deduct</span>
                <input id="deductToggle" type="checkbox" />
                <span class="toggle-track" aria-hidden="true"></span>
            </label>
            <button class="btn" id="lockBtn">Lock at 60s</button>
            <button class="btn" id="themeToggleBtn">Light mode</button>
        </div>

        <!-- Section: Hint text -->
        <div class="hint" id="hintText">
            First click/tap starts the timer. CPM updates live.
        </div>
    </div>

    <!-- Section: Script -->
    <script type="module" src="./renderer.js"></script>
</body>

</html>
